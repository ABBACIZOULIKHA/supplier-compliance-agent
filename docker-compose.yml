services:
  db:
    image: postgres:16
    container_name: supplier_demo_db
    environment:
      POSTGRES_DB: supplier_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/setup.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplier_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  agent:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_READER_URL: postgresql://agent_reader:reader_pw@db:5432/supplier_demo
      DB_WRITER_URL: postgresql://agent_writer:writer_pw@db:5432/supplier_demo
      OLLAMA_HOST: http://host.docker.internal:11434
      TESSERACT_CMD: ""
      POPPLER_PATH: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: "no"

volumes:
  pgdata:
