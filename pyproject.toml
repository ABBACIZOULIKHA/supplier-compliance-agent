[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-compliance-agent"
version = "0.1.0"
description = "Local LLM agent that checks supplier payments against contract PDFs"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5.1",
    "psycopg[binary]>=3.1",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "db: needs the PostgreSQL practice database",
    "e2e: needs PostgreSQL + Ollama (set RUN_E2E=1)",
]
